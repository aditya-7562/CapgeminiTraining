<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>
<body>
<form th:action="@{/books/add}" th:object="${book}" method="post">
    ID: <input type="number" th:field="*{id}" /><br>

    Title: <input type="text" th:field="*{title}" />
    <span th:errors="*{title}" style="color:red"></span><br>

    Author: <input type="text" th:field="*{author}" />
    <span th:errors="*{author}" style="color:red"></span><br>

    Price: <input type="number" step="0.01" th:field="*{price}" />
    <span th:errors="*{price}" style="color:red"></span><br>

    <button type="submit">Add Book</button>
</form>
</body>
</html>
